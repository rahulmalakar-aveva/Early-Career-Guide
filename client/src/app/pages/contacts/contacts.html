<main class="flex-grow w-full px-gutter max-w-container-max mx-auto py-unit-xl">
  <!-- Header Section -->
  <div class="mb-10">
    <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Who To Contact</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Reach out to your peers and mentors for guidance and support.</p>
  </div>

  <!-- Add Contact Button -->
  <div class="mb-8">
    <button 
      (click)="toggleAddForm()"
      class="bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md px-6 py-3 rounded-lg transition-colors shadow-sm flex items-center gap-2">
      <span class="material-symbols-outlined">person_add</span>
      Add Yourself
    </button>
  </div>

  <!-- Add Contact Form -->
  <div *ngIf="showAddForm" class="mb-8 bg-surface-container-lowest rounded-lg p-6 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20">
    <h3 class="font-headline-sm text-headline-sm text-on-surface mb-4">Add Your Contact Information</h3>
    <div class="space-y-4">
      <div>
        <label class="font-label-sm text-label-sm text-on-surface-variant mb-2 block">Your Name</label>
        <input
          [(ngModel)]="newName"
          type="text"
          placeholder="Enter your full name"
          class="w-full px-4 py-3 rounded-lg border border-outline-variant/30 bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
        />
      </div>
      <div>
        <label class="font-label-sm text-label-sm text-on-surface-variant mb-2 block">Your Email</label>
        <input
          [(ngModel)]="newEmail"
          type="email"
          placeholder="your.email@aveva.com"
          class="w-full px-4 py-3 rounded-lg border border-outline-variant/30 bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
        />
      </div>
      <div class="flex gap-3">
        <button 
          (click)="addContact()"
          class="bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md px-6 py-2.5 rounded-lg transition-colors shadow-sm">
          Submit
        </button>
        <button 
          (click)="toggleAddForm()"
          class="border border-outline-variant text-on-surface hover:bg-surface-container font-label-md text-label-md px-6 py-2.5 rounded-lg transition-colors">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Contacts Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let contact of contacts"
         class="bg-surface-container-lowest rounded-lg p-6 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20 flex flex-col hover:shadow-[0px_8px_24px_rgba(0,0,0,0.1)] transition-shadow">
      <div class="flex items-start gap-4 mb-4">
        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
          <span class="material-symbols-outlined text-3xl">person</span>
        </div>
        <div class="flex-1">
          <h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">{{ contact.name }}</h3>
          <a [href]="'mailto:' + contact.email" 
             class="font-body-sm text-body-sm text-primary hover:underline break-all">
            {{ contact.email }}
          </a>
        </div>
      </div>
      <div class="mt-auto pt-4 border-t border-outline-variant/20">
        <a [href]="'mailto:' + contact.email"
           class="flex items-center gap-2 text-primary font-label-md text-label-md hover:gap-3 transition-all">
          <span class="material-symbols-outlined">mail</span>
          <span>Send Email</span>
        </a>
      </div>
    </div>
  </div>
</main>
