<!doctype html>
<html lang="en">

  <title>Early Career Portal</title>
  <base href="/">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

            "secondary-container": "#f8d8ff",

            "body-md": ["Inter"],

<body class="font-body-md antialiased min-h-screen flex flex-col" style="background-color: #ffffff; color: #1e1021;">
