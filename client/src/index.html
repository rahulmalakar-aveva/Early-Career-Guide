<html lang="en">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "body-md": ["Inter"],

<body class="font-body-md antialiased min-h-screen flex flex-col" style="background-color: #f8f9ff; color: #0b1c30;">
